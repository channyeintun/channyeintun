<svg xmlns="http://www.w3.org/2000/svg" width="161.438" height="70" viewBox="0 0 161.438 70" role="img" aria-label="LinkedIn">
<title>LinkedIn</title>
<defs>
  <clipPath id="linkedin-pill"><rect x="14" y="9" width="133.438" height="44" rx="22"/></clipPath>
  <!-- rim mask: linear-gradient(340deg, #000 0%, rgba(0,0,0,0.09) 50%, #000 100%) -->
  <linearGradient id="linkedin-axis" gradientUnits="userSpaceOnUse" x1="95.59" y1="72.37" x2="65.84" y2="-9.37">
    <stop offset="0" stop-color="#fff" stop-opacity="1"/>
    <stop offset=".5" stop-color="#fff" stop-opacity="0.09"/>
    <stop offset="1" stop-color="#fff" stop-opacity="1"/>
  </linearGradient>
  <mask id="linkedin-rim" maskUnits="userSpaceOnUse" x="0" y="0" width="161.438" height="70">
    <rect width="161.438" height="70" fill="url(#linkedin-axis)"/>
  </mask>
  <!-- inset 2px 2px 5px / -2px -2px 5px: shape inverse, offset, blurred, clipped in -->
  <filter id="linkedin-wash" x="-50%" y="-50%" width="200%" height="200%" color-interpolation-filters="sRGB">
    <feGaussianBlur stdDeviation="2.5"/>
  </filter>
  <filter id="linkedin-hair" x="-50%" y="-50%" width="200%" height="200%" color-interpolation-filters="sRGB">
    <feGaussianBlur stdDeviation="2.5"/>
  </filter>
  <filter id="linkedin-shadow" x="-50%" y="-50%" width="200%" height="200%" color-interpolation-filters="sRGB">
    <feGaussianBlur stdDeviation="7"/>
  </filter>
  <path id="linkedin-inv" fill-rule="evenodd" d="M0 0H161.438V70H0Z M14 31.5 a22 22 0 0 1 22 -22 h89.4375 a22 22 0 0 1 22 22 a22 22 0 0 1 -22 22 h-89.4375 a22 22 0 0 1 -22 -22 Z"/>
</defs>

<!-- liquidGlass-wrapper box-shadow: 0 4px 14px rgba(0,0,0,.15) -->
<g transform="translate(0 4)" opacity=".15" filter="url(#linkedin-shadow)"><g fill="#000"><rect x="14" y="9" width="133.438" height="44" rx="22"/></g></g>

<!-- accent fill -->
<g fill="#262A31"><rect x="14" y="9" width="133.438" height="44" rx="22"/></g>

<g clip-path="url(#linkedin-pill)">
  <!-- tint-overlay::before &#8212; #1C1D20 20% plus-lighter, folded into the fill -->
  <g fill="#2C3037"><rect x="14" y="9.5" width="133.438" height="44" rx="22"/></g>

  <g mask="url(#linkedin-rim)">
    <!-- diagonal-highlights -->
    <g clip-path="url(#linkedin-pill)">
      <use href="#linkedin-inv" fill="#fff" filter="url(#linkedin-wash)" transform="translate(2 2)"/>
      <use href="#linkedin-inv" fill="#fff" filter="url(#linkedin-wash)" transform="translate(-2 -2)"/>
      <!-- rim-light: inset 0 0 5px rgba(255,255,255,.05) -->
      <use href="#linkedin-inv" fill="#fff" opacity=".05" filter="url(#linkedin-hair)"/>
    </g>
    <!-- rim-light: inset 0 0 0 .5px rgba(255,255,255,.95) -->
    <g fill="none" stroke="#fff" stroke-opacity=".95" stroke-width=".5">
      <rect x="14.25" y="9.75" width="132.938" height="43.5" rx="21.75"/>
    </g>
  </g>
</g>

<!-- liquidGlass-text (z-index 10) -->
<g transform="translate(35.00 22.75) scale(0.03223)" fill="#fff">
  <path d="M100.28 448H7.4V148.9h92.88zM53.79 108.1C24.09 108.1 0 83.5 0 53.8a53.79 53.79 0 0 1 107.58 0c0 29.7-24.1 54.3-53.79 54.3zM447.9 448h-92.68V302.4c0-34.7-.7-79.2-48.29-79.2-48.29 0-55.69 37.7-55.69 76.7V448h-92.78V148.9h89.08v40.8h1.3c12.4-23.5 42.69-48.3 87.88-48.3 94 0 111.28 61.9 111.28 142.3V448z"/>
</g>
<text x="58.44" y="31.00" textLength="68" lengthAdjust="spacingAndGlyphs"
      font-family="system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="16.5" font-weight="700" letter-spacing="-.1"
      fill="#fff" dominant-baseline="central" dy=".5">LinkedIn</text>
</svg>
