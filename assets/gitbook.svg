<svg xmlns="http://www.w3.org/2000/svg" width="161" height="70" viewBox="0 0 161 70" role="img" aria-label="GitBook">
<title>GitBook</title>
<defs>
  <clipPath id="gitbook-pill"><rect x="14" y="9" width="133" height="44" rx="22"/></clipPath>
  <!-- rim mask: linear-gradient(340deg, #000 0%, rgba(0,0,0,0.09) 50%, #000 100%) -->
  <linearGradient id="gitbook-axis" gradientUnits="userSpaceOnUse" x1="95.35" y1="72.30" x2="65.65" y2="-9.30">
    <stop offset="0" stop-color="#fff" stop-opacity="1"/>
    <stop offset=".5" stop-color="#fff" stop-opacity="0.09"/>
    <stop offset="1" stop-color="#fff" stop-opacity="1"/>
  </linearGradient>
  <mask id="gitbook-rim" maskUnits="userSpaceOnUse" x="0" y="0" width="161" height="70">
    <rect width="161" height="70" fill="url(#gitbook-axis)"/>
  </mask>
  <!-- inset 2px 2px 5px / -2px -2px 5px: shape inverse, offset, blurred, clipped in -->
  <filter id="gitbook-wash" x="-50%" y="-50%" width="200%" height="200%" color-interpolation-filters="sRGB">
    <feGaussianBlur stdDeviation="2.5"/>
  </filter>
  <filter id="gitbook-hair" x="-50%" y="-50%" width="200%" height="200%" color-interpolation-filters="sRGB">
    <feGaussianBlur stdDeviation="2.5"/>
  </filter>
  <filter id="gitbook-shadow" x="-50%" y="-50%" width="200%" height="200%" color-interpolation-filters="sRGB">
    <feGaussianBlur stdDeviation="7"/>
  </filter>
  <path id="gitbook-inv" fill-rule="evenodd" d="M0 0H161V70H0Z M14 31.5 a22 22 0 0 1 22 -22 h89 a22 22 0 0 1 22 22 a22 22 0 0 1 -22 22 h-89 a22 22 0 0 1 -22 -22 Z"/>
</defs>

<!-- liquidGlass-wrapper box-shadow: 0 4px 14px rgba(0,0,0,.15) -->
<g transform="translate(0 4)" opacity=".15" filter="url(#gitbook-shadow)"><g fill="#000"><rect x="14" y="9" width="133" height="44" rx="22"/></g></g>

<!-- accent fill -->
<g fill="#262A31"><rect x="14" y="9" width="133" height="44" rx="22"/></g>

<g clip-path="url(#gitbook-pill)">
  <!-- tint-overlay::before &#8212; #1C1D20 20% plus-lighter, folded into the fill -->
  <g fill="#2C3037"><rect x="14" y="9.5" width="133" height="44" rx="22"/></g>

  <g mask="url(#gitbook-rim)">
    <!-- diagonal-highlights -->
    <g clip-path="url(#gitbook-pill)">
      <use href="#gitbook-inv" fill="#fff" filter="url(#gitbook-wash)" transform="translate(2 2)"/>
      <use href="#gitbook-inv" fill="#fff" filter="url(#gitbook-wash)" transform="translate(-2 -2)"/>
      <!-- rim-light: inset 0 0 5px rgba(255,255,255,.05) -->
      <use href="#gitbook-inv" fill="#fff" opacity=".05" filter="url(#gitbook-hair)"/>
    </g>
    <!-- rim-light: inset 0 0 0 .5px rgba(255,255,255,.95) -->
    <g fill="none" stroke="#fff" stroke-opacity=".95" stroke-width=".5">
      <rect x="14.25" y="9.75" width="132.5" height="43.5" rx="21.75"/>
    </g>
  </g>
</g>

<!-- liquidGlass-text (z-index 10) -->
<g transform="translate(35.00 22.00) scale(0.75000)" fill="#fff">
  <path d="M12.513 1.097c-.645 0-1.233.34-2.407 1.017L3.675 5.82A7.233 7.233 0 0 0 0 12.063v.236a7.233 7.233 0 0 0 3.667 6.238L7.69 20.86c2.354 1.36 3.531 2.042 4.824 2.042 1.292.001 2.47-.678 4.825-2.038l4.251-2.453c1.177-.68 1.764-1.02 2.087-1.579.323-.56.324-1.24.323-2.6v-2.63a1.04 1.04 0 0 0-1.558-.903l-8.728 5.024c-.587.337-.88.507-1.201.507-.323 0-.616-.168-1.204-.506l-5.904-3.393c-.297-.171-.446-.256-.565-.271a.603.603 0 0 0-.634.368c-.045.111-.045.282-.043.625.002.252 0 .378.025.494.053.259.189.493.387.667.089.077.198.14.416.266l6.315 3.65c.589.34.884.51 1.207.51.324 0 .617-.17 1.206-.509l7.74-4.469c.202-.116.302-.172.377-.13.075.044.075.16.075.392v1.193c0 .34.001.51-.08.649-.08.14-.227.224-.522.394l-6.382 3.685c-1.178.68-1.767 1.02-2.413 1.02-.646 0-1.236-.34-2.412-1.022l-5.97-3.452-.043-.025a4.106 4.106 0 0 1-2.031-3.52V11.7c0-.801.427-1.541 1.12-1.944a1.979 1.979 0 0 1 1.982-.001l4.946 2.858c1.174.679 1.762 1.019 2.407 1.02.645 0 1.233-.34 2.41-1.017l7.482-4.306a1.091 1.091 0 0 0 0-1.891L14.92 2.11c-1.175-.675-1.762-1.013-2.406-1.013Z"/>
</g>
<text x="62.00" y="31.00" textLength="64" lengthAdjust="spacingAndGlyphs"
      font-family="system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="16.5" font-weight="700" letter-spacing="-.1"
      fill="#fff" dominant-baseline="central" dy=".5">GitBook</text>
</svg>
